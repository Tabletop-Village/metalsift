name: release

# Publishes to PyPI via Trusted Publishing (OIDC) -- no API token is stored.
# Before the first run, create the project on PyPI and add a trusted publisher
# for repository Tabletop-Village/metalsift, workflow release.yml,
# environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    # macOS arm64: the wheel carries a macosx_11_0_arm64 tag, and building on
    # the target platform keeps the sdist/wheel pair honest.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Show what was built
        run: |
          ls -l dist/
          python -m pip install --upgrade twine
          python -m twine check dist/*
          # the wheel must not be py3-none-any, or pip would install it on
          # platforms with no Metal GPU
          ls dist/ | grep -q 'macosx_11_0_arm64\.whl$' \
            || { echo "::error::wheel is not platform-tagged"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
                && 'https://test.pypi.org/legacy/' || '' }}
